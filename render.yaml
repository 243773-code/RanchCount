# Blueprint de Render para la API RanchCount.
# Los valores marcados con sync: false se capturan en el panel de Render (nunca se suben a Git).
services:
  - type: web
    name: ranchcount-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: INITIAL_OWNER_USERNAME
        sync: false
      - key: INITIAL_OWNER_PASSWORD
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: JPA_DDL_AUTO
        value: update
      - key: DB_DEV_FALLBACK_ENABLED
        value: "false"
      - key: TELEGRAM_ALERTS_ENABLED
        value: "true"
      - key: INITIAL_OWNER_ENABLED
        value: "true"
